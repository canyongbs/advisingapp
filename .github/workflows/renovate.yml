name: Run Renovate

on:
    schedule:
        - cron: '0 11 * * *' # Every day at 11am UTC
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    renovate:
        name: Run Renovate
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ secrets.CGBS_AUTOMATION_APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env]
                  private-key: ${{ secrets.CGBS_AUTOMATION_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write
                  permission-workflows: write
                  permission-checks: write
                  permission-statuses: write
                  permission-vulnerability-alerts: read
                  permission-administration: read

            - name: Run Renovate
              uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
              with:
                  configurationFile: renovate-config.json
                  token: ${{ steps.app-token.outputs.token }}
