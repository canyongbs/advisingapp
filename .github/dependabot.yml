version: 2
updates:
    # Enable version updates for GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'thursday'
          time: '03:00'
          timezone: 'America/New_York'
      groups:
          github-actions-group:
              patterns:
                  - '*' # Groups all GitHub Actions updates
              update-types:
                  - 'minor'
                  - 'patch' # Only groups minor and patch updates
      cooldown:
          default-days: 7

    # Enable version updates for npm (root, portals, widgets)
    - package-ecosystem: 'npm'
      directories:
          - '/'
          - '/portals'
          - '/widgets'
      schedule:
          interval: 'weekly'
          day: 'thursday'
          time: '03:00'
          timezone: 'America/New_York'
      groups:
          npm-group:
              patterns:
                  - '*' # Groups all npm updates
              update-types:
                  - 'minor'
                  - 'patch' # Only groups minor and patch updates
      ignore:
          - dependency-name: '*'
            update-types:
                - 'version-update:semver-major' # Never auto-bump major versions
      cooldown:
          default-days: 7

    # Enable version updates for Composer
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'thursday'
          time: '03:00'
          timezone: 'America/New_York'
      groups:
          composer-group:
              patterns:
                  - '*' # Groups all Composer updates
              update-types:
                  - 'minor'
                  - 'patch' # Only groups minor and patch updates
      ignore:
          - dependency-name: '*'
            update-types:
                - 'version-update:semver-major' # Never auto-bump major versions
      cooldown:
          default-days: 7
